# Development-only overrides. `docker compose up` loads this file automatically;
# for production use:  docker compose -f docker-compose.yml up -d
services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - uploads-data:/app/uploads
      - rendered-data:/app/rendered
  worker:
    volumes:
      - ./backend/app:/app/app
      - uploads-data:/app/uploads
      - rendered-data:/app/rendered
  db:
    ports:
      - '5432:5432'
  redis:
    ports:
      - '6379:6379'
