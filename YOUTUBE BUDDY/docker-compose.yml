version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube-buddy-backend
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - uploads-data:/app/uploads
      - rendered-data:/app/rendered
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube-buddy-worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=1
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - uploads-data:/app/uploads
      - rendered-data:/app/rendered
  db:
    image: postgres:15
    container_name: youtube-buddy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-youtube_buddy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: youtube-buddy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  uploads-data:
  rendered-data:
  redis-data:
